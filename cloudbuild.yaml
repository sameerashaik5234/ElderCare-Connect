# Google Cloud Build & Cloud Run Automated CI/CD Pipeline
steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/eldercare-connect:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/eldercare-connect:latest', '.']

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eldercare-connect:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eldercare-connect'
      - '--image=gcr.io/$PROJECT_ID/eldercare-connect:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/eldercare-connect:latest'
  - 'gcr.io/$PROJECT_ID/eldercare-connect:$COMMIT_SHA'
